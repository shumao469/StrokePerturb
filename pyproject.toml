[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strokeperturb"
version = "0.1.0"
description = "Scope-aware perturbation response assembly, calibration and public benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
reproduce = ["scipy>=1.12,<2", "threadpoolctl>=3,<4", "h5py>=3.10,<4", "scikit-learn>=1.3,<2", "pandas>=2.1,<4", "matplotlib>=3.8,<4"]

[project.scripts]
strokeperturb = "strokeperturb.__main__:main"

[tool.setuptools.packages.find]
include = ["strokeperturb", "strokeperturb.*"]
