<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">StrokePerturb architecture for animal–target response prediction</title>
  <desc id="desc">Matched non-targeting control RNA and a target descriptor feed low-rank, composition-associated and residual RNA response heads. Inner out-of-fold predictions determine mixture weights. Fixed weights assemble a signed whole-transcriptome forecast for a jointly held-out animal and target. Scoring compares the forecast with targeted RNA minus a disjoint control half, using masked target-macro squared error, response amplitude and signed direction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#557383"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183043; }
      .title { font-size: 28px; font-weight: 700; letter-spacing: -.45px; }
      .section { font-size: 18px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 15px; fill: #3d5669; }
      .meta { font-size: 13px; font-weight: 700; letter-spacing: .6px; fill: #295b62; }
      .symbol { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .flow { fill: none; stroke: #557383; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="508" rx="18" fill="#fff" stroke="#d2dfe5" stroke-width="2"/>
  <text class="title" x="31" y="46">StrokePerturb architecture</text>
  <text class="small" x="32" y="72">Control-referenced RNA change for an animal–target population</text>
  <rect x="818" y="27" width="272" height="30" rx="15" fill="#eaf4f4"/>
  <text class="meta" x="954" y="47" text-anchor="middle">JOINT ANIMAL–TARGET HOLDOUT</text>
  <text class="small" x="1090" y="75" text-anchor="end">Training excludes either held-out identity</text>
  <path d="M31 92H1089" stroke="#dce5ea"/>

  <g aria-label="Query inputs">
    <text class="section" x="32" y="126">Query inputs</text>

    <rect x="32" y="150" width="232" height="61" rx="10" fill="#f5f8fb" stroke="#d8e3ec"/>
    <path d="M49 167h16m-16 8h11m-11 8h16m-16 8h8" fill="none" stroke="#4b7795" stroke-width="2.6" stroke-linecap="round"/>
    <text class="label" x="79" y="176">Matched control RNA</text>
    <text class="small" x="79" y="196">Same animal · NTC half 0</text>

    <rect x="32" y="225" width="232" height="61" rx="10" fill="#f5f8fb" stroke="#d8e3ec"/>
    <path d="M49 253l8-9h6l7 9-7 9h-6z" fill="#edf3fa" stroke="#4b7795" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="59.5" cy="253" r="2.4" fill="#4b7795"/>
    <text class="label" x="79" y="251">Target descriptor</text>
    <text class="small" x="79" y="271">One perturbation target</text>

    <path class="flow" d="M264 181h18v75h-18"/>
    <path class="flow" d="M282 219h13m0-46v142"/>
    <path class="flow arrow" d="M295 173h12"/>
    <path class="flow arrow" d="M295 244h12"/>
    <path class="flow arrow" d="M295 315h12"/>
  </g>

  <g aria-label="RNA response components">
    <text class="section" x="312" y="126">Response heads</text>

    <rect x="312" y="143" width="340" height="60" rx="10" fill="#f1f6fc" stroke="#d2e1f2"/>
    <rect x="325" y="154" width="39" height="39" rx="10" fill="#dbe9f9"/>
    <text class="symbol" x="344.5" y="180" fill="#255889" style="fill:#255889">U</text>
    <text class="label" x="376" y="168">Low-rank response</text>
    <text class="small" x="376" y="189">Rank-16 output decoded to all genes</text>

    <rect x="312" y="214" width="340" height="60" rx="10" fill="#eef7f5" stroke="#c9e5df"/>
    <rect x="325" y="225" width="39" height="39" rx="10" fill="#d4eee7"/>
    <text class="symbol" x="344.5" y="251" fill="#175e54" style="fill:#175e54">C</text>
    <text class="label" x="376" y="239">Composition-associated change</text>
    <text class="small" x="376" y="260">Full-gene head · subclass reweighting</text>

    <rect x="312" y="285" width="340" height="60" rx="10" fill="#fbf4ed" stroke="#ebdccc"/>
    <rect x="325" y="296" width="39" height="39" rx="10" fill="#f3e1d0"/>
    <text class="symbol" x="344.5" y="322" fill="#83491e" style="fill:#83491e">W</text>
    <text class="label" x="376" y="310">Residual RNA change</text>
    <text class="small" x="376" y="331">Full-gene head · population residual</text>

    <path class="flow" d="M652 173h22v142h-22M652 244h22"/>
    <path class="flow arrow" d="M674 268h32"/>
  </g>

  <g aria-label="Nested calibration and fixed forecast">
    <text class="section" x="714" y="126">Calibration and prediction</text>

    <rect x="714" y="143" width="376" height="75" rx="10" fill="#f5f8fb" stroke="#d8e3ec"/>
    <text class="label" x="732" y="171">Fit weights on inner folds</text>
    <text class="small" x="732" y="192">Out-of-fold predictions within outer training data</text>

    <path class="flow arrow" d="M902 218v26"/>
    <text class="meta" x="914" y="237">FIX WEIGHTS</text>
    <rect x="714" y="249" width="376" height="96" rx="10" fill="#edf6f8" stroke="#c6dfe5"/>
    <text class="label" x="732" y="274">Fixed forecast for the held-out query</text>
    <text x="732" y="300" font-size="19">B + (1 − λ)aU + λ(bC + cW)</text>
    <text class="small" x="732" y="325">Signed RNA change · B is the reference term</text>
  </g>

  <g aria-label="Scoring only">
    <rect x="23" y="375" width="1074" height="112" rx="13" fill="#f5f9fa" stroke="#dce7ec"/>
    <text class="meta" x="42" y="404">SCORING ONLY</text>
    <text class="label" x="42" y="433">Observed RNA contrast</text>
    <text class="small" x="42" y="457">Targeted RNA − matched NTC half 1</text>
    <text class="small" x="42" y="476">Disjoint from the query control</text>

    <path class="flow arrow" d="M333 439h172"/>
    <rect x="514" y="391" width="568" height="81" rx="10" fill="#fff" stroke="#ccdde4"/>
    <text class="label" x="532" y="419">Compare measured and predicted responses</text>
    <text class="small" x="532" y="443">Masked target-macro MSE · uncentred and within-animal-centred</text>
    <text class="small" x="532" y="462">Response amplitude and signed direction</text>
    <path class="flow arrow" d="M902 345v40"/>
  </g>
</svg>


